function setupTouchButton(
    element,
    key
){

    element.addEventListener(
        'pointerdown',
        e=>{

            e.preventDefault();

            try{
                element.setPointerCapture(
                    e.pointerId
                );
            }catch(_){}

            keys[key] = true;

            if(key === 'space'){

                jumpPressed = true;
            }

        }
    );


    element.addEventListener(
        'pointerup',
        e=>{

            e.preventDefault();

            keys[key] = false;

        }
    );


    element.addEventListener(
        'pointercancel',
        e=>{

            keys[key] = false;

        }
    );


    element.addEventListener(
        'pointerleave',
        e=>{

            if(e.buttons === 0){

                keys[key] = false;

            }

        }
    );

}

/* =========================================================

========================================================= */

const LEADERBOARD_KEY =
    'winter_block_parkour_leaderboard_v1';


function getLeaderboard(){

    try{

        const data =
            localStorage.getItem(
                LEADERBOARD_KEY
            );

        if(!data) return [];

        const parsed =
            JSON.parse(data);

        if(!Array.isArray(parsed))
            return [];

        return parsed
            .filter(x =>
                x &&
                typeof x.name === 'string' &&
                Number.isFinite(x.time)
            )
            .sort(
                (a,b)=>a.time-b.time
            )
            .slice(0,10);

    }catch(e){

        return [];

    }

}


function saveLeaderboard(data){

    try{

        localStorage.setItem(
            LEADERBOARD_KEY,
            JSON.stringify(
                data.slice(0,10)
            )
        );

    }catch(e){}

}


function renderLeaderboard(){

    const list =
        getLeaderboard();

    const element =
        document.getElementById(
            'leaderboard'
        );

    if(!list.length){

        element.innerHTML =
            '<div class="empty">Пока нет результатов</div>';

        return;
    }


    element.innerHTML =
        list.map(
            (item,index)=>`

                <div class="row">

                    <div class="rank">
                        ${index+1}
                    </div>

                    <div>
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="score">
                        ${item.time.toFixed(1)} с
                    </div>

                </div>

            `
        ).join('');

}


function escapeHtml(text){

    return String(text)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");

}

/* =========================================================
   UPDATE PLAYER MOVEMENT
========================================================= */

function updateMovement(dt){

    let inputX = 0;
    let inputZ = 0;


    /* Horizontal */

    if(
        keys.a ||
        keys.arrowleft
    ){

        inputX -= 1;

    }


    if(
        keys.d ||
        keys.arrowright
    ){

        inputX += 1;

    }


    /* Forward/backward */

    if(
        keys.w ||
        keys.arrowup
    ){

        inputZ -= 1;

    }


    if(
        keys.s ||
        keys.arrowdown
    ){

        inputZ += 1;

    }


    /* Normalize diagonal */

    const inputLength =
        Math.hypot(
            inputX,
            inputZ
        );

    if(inputLength > 1){

        inputX /= inputLength;
        inputZ /= inputLength;

    }


    /*
        Для этого уровня основное
        движение вперёд идёт по Z.

        Поэтому если игрок держит
        W — он идёт вперёд.
    */

    const targetX =
        inputX * MAX_SPEED;

    const targetZ =
        inputZ * MAX_SPEED;


    const accel =
        onGround
            ? ACCELERATION
            : AIR_ACCELERATION;


    /*
        Плавно приближаем скорость
        к целевой.
    */

    if(Math.abs(targetX) > .01){

        velX =
            THREE.MathUtils.damp(
                velX,
                targetX,
                accel,
                dt
            );

    }else{

        velX =
            THREE.MathUtils.damp(
                velX,
                0,
                FRICTION,
                dt
            );

    }


    if(Math.abs(targetZ) > .01){

        velZ =
            THREE.MathUtils.damp(
                velZ,
                targetZ,
                accel,
                dt
            );

    }else{

        velZ =
            THREE.MathUtils.damp(
                velZ,
                0,
                FRICTION,
                dt
            );

    }


    player.position.x +=
        velX * dt;

    player.position.z +=
        velZ * dt;

}


/* =========================================================
   UPDATE PHYSICS
========================================================= */

function updatePhysics(dt){

    wasOnGround =
        onGround;


    /* Coyote time */

    if(onGround){

        coyoteTimer =
            COYOTE_TIME;

    }else{

        coyoteTimer =
            Math.max(
                0,
                coyoteTimer-dt
            );

    }


    /* Jump buffer */

    if(jumpPressed){

        jumpBufferTimer =
            JUMP_BUFFER;

        jumpPressed = false;

    }else{

        jumpBufferTimer =
            Math.max(
                0,
                jumpBufferTimer-dt
            );

    }


    /*
        Прыжок.

        Он срабатывает либо когда
        стоим на земле, либо в
        течение coyote time.
    */

    if(
        jumpBufferTimer > 0 &&
        (onGround || coyoteTimer > 0)
    ){

        doJump();

    }


    /* Gravity */

    if(
        !jumpHeld &&
        velY > 0 &&
        !onGround
    ){

        /*
            Если кнопку отпустили
            раньше — прыжок становится
            ниже и приятнее.
        */

        velY -=
            GRAVITY * 1.25 * dt;

    }else{

        velY -=
            GRAVITY * dt;

    }


    player.position.y +=
        velY * dt;


    /* Ground collision */

    onGround = false;


    for(const p of platforms){

        const hw =
            p.geometry.parameters.width/2;

        const hd =
            p.geometry.parameters.depth/2;

        const top =
            p.position.y +
            p.geometry.parameters.height/2;


        const insideX =
            player.position.x >
                p.position.x-hw-.42 &&
            player.position.x <
                p.position.x+hw+.42;


        const insideZ =
            player.position.z >
                p.position.z-hd-.42 &&
            player.position.z <
                p.position.z+hd+.42;


        if(
            insideX &&
            insideZ &&
            player.position.y <= top+.18 &&
            player.position.y >= top-1.25 &&
            velY <= 0
        ){

            player.position.y =
                top;

            velY = 0;

            onGround = true;

        }

    }


    /*
        Если персонаж упал.
    */

    if(
        player.position.y < -8 ||
        Math.abs(player.position.x) > 30
    ){

        restartGame();

    }

}


/* =========================================================
   PLAYER ANIMATION
========================================================= */

let animationTime = 0;


function updatePlayerAnimation(dt){

    animationTime += dt;


    const horizontalSpeed =
        Math.hypot(
            velX,
            velZ
        );


    const moving =
        horizontalSpeed > .35 &&
        onGround;


    if(moving){

        const walkSpeed =
            8 + horizontalSpeed*.45;

        const swing =
            Math.sin(
                animationTime*walkSpeed
            )*.55;

        armL.rotation.x =
            swing;

        armR.rotation.x =
            -swing;

        legL.rotation.x =
            -swing;

        legR.rotation.x =
            swing;


        body.position.y =
            1 +
            Math.abs(
                Math.sin(
                    animationTime*walkSpeed*2
                )
            )*.035;


        player.rotation.z =
            THREE.MathUtils.damp(
                player.rotation.z,
                -velX*.025,
                10,
                dt
            );

    }else{

        /*
            Плавно возвращаем
            конечности.
        */

        armL.rotation.x =
            THREE.MathUtils.damp(
                armL.rotation.x,
                0,
                12,
                dt
            );

        armR.rotation.x =
            THREE.MathUtils.damp(
                armR.rotation.x,
                0,
                12,
                dt
            );

        legL.rotation.x =
            THREE.MathUtils.damp(
                legL.rotation.x,
                0,
                12,
                dt
            );

        legR.rotation.x =
            THREE.MathUtils.damp(
                legR.rotation.x,
                0,
                12,
                dt
            );

    }


    /*
        Прыжок
    */

    if(!onGround){

        const jumpTilt =
            THREE.MathUtils.clamp(
                -velY*.025,
                -.28,
                .28
            );

        player.rotation.x =
            THREE.MathUtils.damp(
                player.rotation.x,
                jumpTilt,
                8,
                dt
            );

        armL.rotation.x =
            THREE.MathUtils.damp(
                armL.rotation.x,
                -.35,
                8,
                dt
            );

        armR.rotation.x =
            THREE.MathUtils.damp(
                armR.rotation.x,
                -.35,
                8,
                dt
            );

    }else{

        player.rotation.x =
            THREE.MathUtils.damp(
                player.rotation.x,
                0,
                10,
                dt
            );

    }

}


/* =========================================================
   COINS
========================================================= */

function updateCoins(dt){

    for(const object of scene.children){

        if(
            object.userData &&
            object.userData.coin &&
            !object.userData.taken
        ){

            object.rotation.z +=
                dt*5;


            if(
                object.position.distanceTo(
                    player.position
                ) < 1.35
            ){

                object.userData.taken =
                    true;

                object.visible =
                    false;

                coins++;

                coinsElement.textContent =
                    coins;

            }

        }

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishGame(){

    if(finished)
        return;

    finished = true;

    finalRunTime =
        (performance.now()-startTime)/1000;

    document
        .getElementById(
            'finalTime'
        )
        .textContent =
        finalRunTime.toFixed(1);

    document
        .getElementById(
            'finalCoins'
        )
        .textContent =
        coins;

    document
        .getElementById(
            'playerName'
        )
        .value = '';

    finishScreen.style.display =
        'flex';

}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();


function updateCamera(dt){

    /*
        Камера следует за игроком
        через damp, поэтому нет рывков.
    */

    cameraTarget.set(
        player.position.x,
        player.position.y+6,
        player.position.z+11
    );


    camera.position.x =
        THREE.MathUtils.damp(
            camera.position.x,
            cameraTarget.x,
            5.5,
            dt
        );

    camera.position.y =
        THREE.MathUtils.damp(
            camera.position.y,
            cameraTarget.y,
            5.5,
            dt
        );

    camera.position.z =
        THREE.MathUtils.damp(
            camera.position.z,
            cameraTarget.z,
            5.5,
            dt
        );


    const lookTarget =
        new THREE.Vector3(
            player.position.x,
            player.position.y+1,
            player.position.z-7
        );


    camera.lookAt(
        lookTarget
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function update(){

    if(finished)
        return;


    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    /* Update jump held */

    jumpHeld =
        !!(
            keys.space ||
            keys.w ||
            keys.arrowup
        );


    updateMovement(dt);

    updatePhysics(dt);

    updatePlayerAnimation(dt);

    updateCoins(dt);

    updateCamera(dt);


    /*
        Finish line
    */

    if(
        player.position.z < -61 &&
        player.position.y > 6.2
    ){

        finishGame();

    }


    timeElement.textContent =
        (
            (performance.now()-startTime)
            /1000
        ).toFixed(1);

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    requestAnimationFrame(loop);

    update();

    renderer.render(
        scene,
        camera
    );

}

loop();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   PREVENT MOBILE GESTURES
========================================================= */

document.addEventListener(
    'touchmove',
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

</script>

</body>
</html>
