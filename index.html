<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Winter Block Parkour</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#9edcff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:#fff;
  text-shadow:0 2px 4px #245;
}

#title{
  position:absolute;
  top:16px;
  left:18px;
  font-size:24px;
  font-weight:800;
}

#stats{
  position:absolute;
  top:52px;
  left:18px;
  font-size:15px;
}

#help{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:#123a55aa;
  padding:9px 14px;
  border-radius:12px;
  font-size:13px;
  white-space:nowrap;
}

#music{
  position:fixed;
  top:18px;
  right:18px;
  pointer-events:auto;
  border:0;
  border-radius:14px;
  background:#ffffffcc;
  color:#17364a;
  font-weight:800;
  font-size:15px;
  padding:10px 14px;
}

#touch{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  gap:10px;
  pointer-events:auto;
}

#touch button{
  width:62px;
  height:62px;
  border:0;
  border-radius:18px;
  background:#ffffffcc;
  color:#17364a;
  font-weight:900;
  font-size:25px;
}

@media(max-width:700px){
  #touch{
    display:flex;
  }

  #help{
    display:none;
  }

  #title{
    font-size:19px;
  }

  #stats{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="ui">

  <div id="title">❄ WINTER BLOCK PARKOUR</div>

  <div id="stats">
    🪙 Монеты: <span id="coins">0</span>
    · ⏱ <span id="time">0.0</span>
  </div>

</div>

<button id="music">🎵 Музыка</button>

<div id="touch">
  <button id="left">↶</button>
  <button id="jump">↑</button>
  <button id="right">↷</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9edcff);

scene.fog = new THREE.Fog(
  0x9edcff,
  25,
  105
);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   СВЕТ
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xeaf8ff,
    0x7896a8,
    2.2
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2.4
  );

sun.position.set(
  -15,
  30,
  10
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   МАТЕРИАЛЫ
========================= */

const mats = {

  snow:
    new THREE.MeshStandardMaterial({
      color:0xf4fbff,
      roughness:1
    }),

  ice:
    new THREE.MeshStandardMaterial({
      color:0x74c9ef,
      roughness:.35,
      metalness:.05
    }),

  blue:
    new THREE.MeshStandardMaterial({
      color:0x2877c8,
      roughness:.65
    }),

  dark:
    new THREE.MeshStandardMaterial({
      color:0x183c62,
      roughness:.8
    }),

  gold:
    new THREE.MeshStandardMaterial({
      color:0xffd34d,
      emissive:0x5b3e00,
      emissiveIntensity:.25
    }),

  red:
    new THREE.MeshStandardMaterial({
      color:0xff5964,
      roughness:.7
    })

};


/* =========================
   КУБ
========================= */

function box(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  mat=mats.snow
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,
        sy,
        sz
      ),
      mat
    );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow = true;
  m.receiveShadow = true;

  scene.add(m);

  return m;
}


/* =========================
   МОНЕТА
========================= */

function coin(x,y,z){

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .38,
        .38,
        .12,
        24
      ),
      mats.gold
    );

  m.rotation.x =
    Math.PI / 2;

  m.position.set(
    x,
    y,
    z
  );

  m.userData.coin = true;

  scene.add(m);

  return m;
}


/* =========================
   ЁЛКИ
========================= */

function tree(x,z){

  box(
    x,
    2,
    z,
    1.1,
    4,
    1.1,
    mats.dark
  );

  box(
    x,
    4.4,
    z,
    3.3,
    2.8,
    3.3,
    mats.blue
  );

  box(
    x,
    6,
    z,
    2.4,
    2.2,
    2.4,
    mats.snow
  );
}


for(let i=0;i<34;i++){

  let x =
    (Math.random()-.5)*70;

  let z =
    8-Math.random()*110;

  if(Math.abs(x)<7)
    x += x<0 ? -12 : 12;

  tree(x,z);
}


/* =========================
   ПЛАТФОРМЫ
========================= */

const platforms = [];

function platform(
  x,
  y,
  z,
  w,
  d,
  h=.8,
  mat=mats.snow
){

  const p =
    box(
      x,
      y,
      z,
      w,
      h,
      d,
      mat
    );

  platforms.push(p);

  return p;
}


platform(0,0,2,10,8);
platform(0,0,-6,7,7);
platform(4,1,-15,6,6,mats.ice);
platform(-2,2,-24,5,6);
platform(3,3,-33,6,5,mats.snow);
platform(-3,4,-42,5,6,mats.ice);
platform(2,5,-52,7,7);
platform(0,6,-63,9,8,mats.snow);


/* =========================
   ПРЕПЯТСТВИЯ
========================= */

platform(0,1,-10,2,1,1.5,mats.red);
platform(4,2,-19,2,2,1.4,mats.red);
platform(-2,3,-28,1.6,3,1.8,mats.red);
platform(3,4,-37,2,1.5,1.8,mats.red);
platform(-3,5,-47,1.5,2,1.8,mats.red);


/* =========================
   МОНЕТЫ
========================= */

[
  [0,1,-4],
  [4,2,-14],
  [-2,3,-23],
  [3,4,-32],
  [-3,5,-41],
  [2,6,-51],
  [0,7,-61]
].forEach(a=>coin(...a));


/* =========================
   ИГРОК
========================= */

const player =
  new THREE.Group();

const body =
  box(
    0,
    1.05,
    2,
    1.1,
    1.5,
    .75,
    mats.blue
  );

body.parent=null;
scene.remove(body);
player.add(body);


const head =
  box(
    0,
    2.15,
    2,
    .9,
    .9,
    .9,
    mats.snow
  );

head.parent=null;
scene.remove(head);
player.add(head);


player.position.set(
  0,
  0,
  2
);

scene.add(player);


/* =========================
   СНЕГ
========================= */

const snowGeometry =
  new THREE.BufferGeometry();

const snowCount = 900;

const snowPositions = [];

for(let i=0;i<snowCount;i++){

  snowPositions.push(
    (Math.random()-.5)*80,
    Math.random()*35,
    Math.random()*140-100
  );

}

snowGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(
    snowPositions,
    3
  )
);

const snowMaterial =
  new THREE.PointsMaterial({
    color:0xffffff,
    size:.18,
    transparent:true,
    opacity:.85
  });

const snow =
  new THREE.Points(
    snowGeometry,
    snowMaterial
  );

scene.add(snow);


/* =========================
   УПРАВЛЕНИЕ
========================= */

let velY = 0;
let onGround = false;

let coins = 0;

let start =
  performance.now();

let finished = false;

const keys = {};


addEventListener(
  'keydown',
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;

    if(e.code === 'Space')
      keys.space = true;

    if(e.key.toLowerCase()==='r')
      location.reload();

  }
);


addEventListener(
  'keyup',
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;

    if(e.code === 'Space')
      keys.space = false;

  }
);


/* =========================
   ТЕЛЕФОН
========================= */

function touch(
  btn,
  key
){

  btn.addEventListener(
    'touchstart',
    e => {

      e.preventDefault();

      keys[key] = true;

    }
  );

  btn.addEventListener(
    'touchend',
    e => {

      e.preventDefault();

      keys[key] = false;

    }
  );

}

touch(
  document.getElementById('left'),
  'arrowleft'
);

touch(
  document.getElementById('right'),
  'arrowright'
);

touch(
  document.getElementById('jump'),
  'space'
);


/* =========================
   МУЗЫКА
========================= */

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;

const musicButton =
  document.getElementById('music');


function startMusic(){

  if(musicPlaying)
    return;

  audioContext =
    new (window.AudioContext ||
         window.webkitAudioContext)();

  const gain =
    audioContext.createGain();

  gain.gain.value = .045;

  gain.connect(
    audioContext.destination
  );

  const notes = [
    261.63,
    329.63,
    392.00,
    329.63,
    293.66,
    349.23,
    440.00,
    349.23
  ];

  let index = 0;

  function playNote(){

    if(!musicPlaying)
      return;

    const osc =
      audioContext.createOscillator();

    osc.type = 'sine';

    osc.frequency.value =
      notes[index];

    osc.connect(gain);

    osc.start();

    osc.stop(
      audioContext.currentTime+.28
    );

    index =
      (index+1)%notes.length;

    musicTimer =
      setTimeout(
        playNote,
        330
      );
  }

  musicPlaying = true;

  musicButton.textContent =
    '🔊 Музыка';

  playNote();
}


function stopMusic(){

  musicPlaying = false;

  clearTimeout(musicTimer);

  musicButton.textContent =
    '🔇 Музыка';

}


musicButton.addEventListener(
  'click',
  () => {

    if(musicPlaying)
      stopMusic();
    else
      startMusic();

  }
);


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

const clock =
  new THREE.Clock();


function update(){

  if(finished)
    return;

  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  /* АВТОМАТИЧЕСКИЙ БЕГ */

  let runSpeed = 6.5;


  /*
     W / ↑ = ускорение
  */

  if(
    keys.w ||
    keys.arrowup
  ){

    runSpeed = 9;

  }


  /*
     S / ↓ = торможение
  */

  if(
    keys.s ||
    keys.arrowdown
  ){

    runSpeed = 3;

  }


  /*
     ← → = ПОВОРОТ
  */

  const turnSpeed = 2.4;


  if(
    keys.arrowleft ||
    keys.a
  ){

    player.rotation.y +=
      turnSpeed*dt;

  }


  if(
    keys.arrowright ||
    keys.d
  ){

    player.rotation.y -=
      turnSpeed*dt;

  }


  /*
     АВТОМАТИЧЕСКОЕ ДВИЖЕНИЕ
  */

  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    );

  direction.applyQuaternion(
    player.quaternion
  );


  player.position.x +=
    direction.x *
    runSpeed *
    dt;

  player.position.z +=
    direction.z *
    runSpeed *
    dt;


  /* ПРЫЖОК */

  if(
    keys.space &&
    onGround
  ){

    velY = 8.5;

    onGround = false;

  }


  /* ГРАВИТАЦИЯ */

  velY -=
    22*dt;

  player.position.y +=
    velY*dt;

  onGround = false;


  /* КОЛЛИЗИИ */

  for(
    const p of platforms
  ){

    const hw =
      p.geometry.parameters.width/2;

    const hd =
      p.geometry.parameters.depth/2;

    const top =
      p.position.y +
      p.geometry.parameters.height/2;


    if(

      player.position.x >
      p.position.x-hw-.45 &&

      player.position.x <
      p.position.x+hw+.45 &&

      player.position.z >
      p.position.z-hd-.45 &&

      player.position.z <
      p.position.z+hd+.45 &&

      player.position.y <=
      top+.2 &&

      player.position.y >=
      top-1.2 &&

      velY<=0

    ){

      player.position.y =
        top;

      velY = 0;

      onGround = true;

    }

  }


  /* ПАДЕНИЕ */

  if(
    player.position.y < -8 ||
    Math.abs(player.position.x)>30
  ){

    location.reload();

  }


  /* МОНЕТЫ */

  for(
    const o of scene.children
  ){

    if(
      o.userData.coin &&
      !o.userData.taken
    ){

      o.rotation.z +=
        dt*5;


      if(
        o.position.distanceTo(
          player.position
        ) < 1.3
      ){

        o.userData.taken =
          true;

        o.visible = false;

        coins++;

        document.getElementById(
          'coins'
        ).textContent = coins;

      }

    }

  }


  /* СНЕГ */

  const positions =
    snow.geometry.attributes
      .position.array;


  for(
    let i=1;
    i<positions.length;
    i+=3
  ){

    positions[i] -=
      dt*2.5;


    if(
      positions[i]<0
    ){

      positions[i]=35;

    }

  }


  snow.geometry.attributes
    .position.needsUpdate = true;


  /* ФИНИШ */

  if(
    player.position.z < -61 &&
    player.position.y > 6.2
  ){

    finished = true;

    alert(
      '🏆 ФИНИШ!\n\n' +
      '🪙 Монеты: ' + coins
    );

  }


  /* КАМЕРА */

  const cameraTarget =
    new THREE.Vector3(
      player.position.x,
      player.position.y+5.5,
      player.position.z+10
    );


  camera.position.lerp(
    cameraTarget,
    .09
  );


  /*
     ЛЁГКОЕ ПОКАЧИВАНИЕ
  */

  const bob =
    Math.sin(
      performance.now()*.012
    )*.08;

  camera.position.y +=
    bob;


  camera.lookAt(
    player.position.x,
    player.position.y+1.2,
    player.position.z-6
  );


  /* ВРЕМЯ */

  document.getElementById(
    'time'
  ).textContent =
    (
      (performance.now()-start)/1000
    ).toFixed(1);

}


/* =========================
   ЗАПУСК
========================= */

function loop(){

  requestAnimationFrame(loop);

  update();

  renderer.render(
    scene,
    camera
  );

}

loop();


/* =========================
   RESIZE
========================= */

addEventListener(
  'resize',
  () => {

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
