<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Winter Block Parkour</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071b32;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
  user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  text-shadow:0 2px 5px #00192e;
}

#title{
  position:absolute;
  top:18px;
  left:18px;
  font-size:24px;
  font-weight:900;
  letter-spacing:.5px;
}

#stats{
  position:absolute;
  top:58px;
  left:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.stat{
  padding:8px 12px;
  border-radius:14px;
  background:#062d4dcc;
  border:1px solid #9eeaff66;
  backdrop-filter:blur(6px);
  font-weight:800;
}

#musicButton{
  position:absolute;
  top:18px;
  right:18px;
  pointer-events:auto;
  border:1px solid #ffffff88;
  border-radius:16px;
  padding:10px 15px;
  background:#ffffffdd;
  color:#103652;
  font-weight:900;
  font-size:15px;
  box-shadow:0 5px 15px #00182c55;
}

#checkpointText{
  position:absolute;
  top:110px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 16px;
  border-radius:18px;
  background:#087bc9cc;
  opacity:0;
  transition:opacity .25s;
  font-weight:900;
}

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(90%,430px);
  padding:30px;
  text-align:center;
  border-radius:26px;
  background:#062b48ee;
  border:2px solid #a9eeff88;
  box-shadow:0 20px 70px #00182c99;
  display:none;
  pointer-events:auto;
}

#message h1{
  margin:0 0 12px;
  font-size:34px;
}

#message p{
  margin:8px 0;
  font-size:17px;
}

#restartButton{
  margin-top:18px;
  border:0;
  border-radius:16px;
  padding:13px 24px;
  background:#56d7ff;
  color:#06334c;
  font-weight:900;
  font-size:17px;
}

#help{
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:14px;
  background:#062b48aa;
  font-size:13px;
  white-space:nowrap;
}

#mobileControls{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:none;
}

#joystick{
  position:absolute;
  left:24px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  border:3px solid #ffffff88;
  background:#73cfff30;
  box-shadow:
    inset 0 0 25px #ffffff18,
    0 8px 30px #00182c66;
  pointer-events:auto;
  touch-action:none;
}

#joystickInner{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  margin-left:-29px;
  margin-top:-29px;
  border-radius:50%;
  background:#f7fdffdd;
  border:3px solid #8be5ff;
  box-shadow:0 5px 15px #00182c66;
}

#jumpButton{
  position:absolute;
  right:24px;
  bottom:35px;
  width:135px;
  height:82px;
  border:2px solid #ffffffaa;
  border-radius:27px;
  background:#ffffffdd;
  color:#073653;
  font-size:18px;
  font-weight:900;
  box-shadow:0 8px 25px #00182c66;
  pointer-events:auto;
  touch-action:none;
}

#jumpButton:active{

}

@media(max-width:700px){

  #mobileControls{
    display:block;
  }

  }

  }

    left:13px;
  }

    font-size:12px;

    padding:8px 11px;

@media(max-height:600px){

    height:115px;
    bottom:15px;

    height:68px;

<div id="ui">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   WINTER BLOCK PARKOUR
   Полная версия
========================================================= */


/* =========================================================
   ОСНОВА
========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x9ddcff);

scene.fog =
  new THREE.Fog(
    0x9ddcff,
    35,

const camera =
  new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    400
  );


const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });


renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* =========================================================
   СВЕТ
========================================================= */

const hemisphere =
  new THREE.HemisphereLight(
    0xdff8ff,
    0x24496c,
    2.2
  );

scene.add(hemisphere);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  -25,
  35,
  20
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -70;
sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;

scene.add(sun);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const snowMaterial =
  new THREE.MeshPhysicalMaterial({

    color:0xf5fcff,

    roughness:.75,

    metalness:.02,

    clearcoat:.25,

    clearcoatRoughness:.4

  });


const iceMaterial =
  new THREE.MeshPhysicalMaterial({

    color:0x55d7ff,

    roughness:.08,

    metalness:.08,

    transmission:.18,

    thickness:1,

    clearcoat:1,

    clearcoatRoughness:.06,

    emissive:0x073d70,

    emissiveIntensity:.18

  });


const deepIceMaterial =
  new THREE.MeshPhysicalMaterial({

    color:0x1978c9,

    roughness:.12,

    metalness:.1,

    clearcoat:1,

    clearcoatRoughness:.05,

    emissive:0x032e65,

    emissiveIntensity:.22

  });


const blueMaterial =
  new THREE.MeshStandardMaterial({

    color:0x146ac2,

    roughness:.55

  });


const darkMaterial =
  new THREE.MeshStandardMaterial({

    color:0x143d61,

    roughness:.8

  });


const redMaterial =
  new THREE.MeshStandardMaterial({

    color:0xff5367,

    roughness:.5,

    emissive:0x5d0614,

    emissiveIntensity:.35

  });


const goldMaterial =
  new THREE.MeshStandardMaterial({

    color:0xffd83d,

    roughness:.2,

    metalness:.65,

    emissive:0x664600,

    emissiveIntensity:.3

  });


const crystalMaterial =
  new THREE.MeshPhysicalMaterial({

    color:0x8cecff,

    transparent:true,

    opacity:.82,

    roughness:.05,

    metalness:.08,

    transmission:.35,

    thickness:.7,

    clearcoat:1,

    emissive:0x1c9dff,

    emissiveIntensity:.25

  });


/* =========================================================
   ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ КУБА
========================================================= */

function createBox(
  x,
  y,
  z,
  w,
  h,
  d,
  material
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;

}


/* =========================================================
   ЛЕДЯНЫЕ ПЛАТФОРМЫ
========================================================= */

const platforms = [];


function createIcePlatform(
  x,
  y,
  z,
  w,
  d,
  h=.8
){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    y,
    z
  );


  const main =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      iceMaterial
    );

  main.castShadow = true;
  main.receiveShadow = true;

  group.add(main);


  /* снежная верхушка */

  const snowTop =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.08,
        .18,
        d+.08
      ),
      snowMaterial
    );

  snowTop.position.y =
    h/2+.08;

  snowTop.castShadow = true;

  group.add(snowTop);


  /* нижний слой льда */

  const bottom =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w*.86,
        h*.9,
        d*.86
      ),
      deepIceMaterial
    );

  bottom.position.y =
    -.08;

  group.add(bottom);


  /* кристаллы */

  addCrystals(
    group,
    w,
    d,
    h
  );


  scene.add(group);

  platforms.push({
    object:group,
    width:w,
    depth:d,
    height:h
  });

  return group;

}


/* =========================================================
   КРИСТАЛЛЫ
========================================================= */

function addCrystal(
  parent,
  x,
  y,
  z,
  scale
){

  const crystal =
    new THREE.Mesh(
      new THREE.OctahedronGeometry(
        .7,
        0
      ),
      crystalMaterial
    );

  crystal.position.set(
    x,
    y,
    z
  );

  crystal.scale.set(
    scale*.65,
    scale*1.8,
    scale*.65
  );

  crystal.rotation.y =
    Math.random()*Math.PI;

  crystal.castShadow = true;

  parent.add(crystal);

  return crystal;

}


function addCrystals(
  parent,
  w,
  d,
  h
){

  const amount =
    Math.max(
      2,
      Math.floor((w+d)/5)
    );


  for(
    let i=0;
    i<amount;
    i++
  ){

    const side =
      Math.random()<.5;

    let x;
    let z;

    if(side){

      x =
        (Math.random()-.5) *
        (w-.8);

      z =
        (Math.random()<.5 ? -1 : 1) *
        (d/2-.25);

    }else{

      x =
        (Math.random()<.5 ? -1 : 1) *
        (w/2-.25);

      z =
        (Math.random()-.5) *
        (d-.8);

    }

    addCrystal(
      parent,
      x,
      h/2+.5,
      z,
      .45+Math.random()*.45
    );

  }

}


/* =========================================================
   УРОВЕНЬ
========================================================= */

createIcePlatform(

createIcePlatform(

createIcePlatform(

/* =========================================================
   ОПАСНЫЕ БЛОКИ
========================================================= */

function createHazard(
  x,
  y,
  z,
  w,
  h,
  d
){

  const hazard =
    createBox(
      x,
      y,
      z,
      w,
      h,
      d,
      redMaterial
    );

  hazard.userData.hazard =
    true;

  return hazard;

}

);

);

);

createHazard(

);

createHazard(

  2,1.2,1.4
);


/* =========================================================
   ЛЕДЯНЫЕ СТОЛБЫ
========================================================= */

function iceColumn(
  x,
  y,
  z,
  height
){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    y,
    z
  );


  const base =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .8,
        1.05,
        height,
        6
      ),
      deepIceMaterial
    );

  base.position.y =
    height/2;

  base.castShadow = true;
  base.receiveShadow = true;

  group.add(base);


  const top =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .9,
        1.8,
        6
      ),
      crystalMaterial
    );

  top.position.y =
    height+0.7;

  top.castShadow = true;

  group.add(top);

  scene.add(group);

}


iceColumn(-9,0,-13,5);
iceColumn(10,0,-22,7);
iceColumn(-10,0,-40,8);
iceColumn(10,0,-58,6);
iceColumn(-11,0,-80,9);
iceColumn(11,0,-105,10);


/* =========================================================
   ЁЛКИ
========================================================= */

function createTree(
  x,
  z,
  scale=1
){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );

  group.scale.setScalar(scale);


  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .28,
        .38,
        2,
        6
      ),
      darkMaterial
    );

  trunk.position.y=1;

  trunk.castShadow=true;

  group.add(trunk);


  for(
    let i=0;
    i<3;
    i++
  ){

    const cone =
      new THREE.Mesh(
        new THREE.ConeGeometry(
          1.7-i*.3,
          2.5,
          7
        ),
        blueMaterial
      );

    cone.position.y =
      2+i*1.35;

    cone.castShadow=true;

    group.add(cone);

  }


  const snow =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        1.75,
        1.2,
        7
      ),
      snowMaterial
    );

  snow.position.y=5.2;

  snow.castShadow=true;

  group.add(snow);


  scene.add(group);

}


const treePositions = [

  [-9,-5,1.1],
  [9,-11,1],
  [-10,-31,1.3],
  [10,-43,1],
  [-10,-67,1.2],

treePositions.forEach(

/* =========================================================
   МОНЕТЫ
========================================================= */

const coins = [];


function createCoin(
  x,
  y,
  z
){

  const coin =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .42,
        .42,
        .13,
        24

      goldMaterial
    );

  coin.rotation.x =
    Math.PI/2;

  coin.position.set(
    x,
    y,
    z
  );

  coin.castShadow=true;

  coin.userData.collected=false;

  scene.add(coin);

  coins.push(coin);

}

/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */

const keys = {};

let joystickX = 0;
let joystickY = 0;

let jumping = false;


addEventListener(
  'keydown',
  e=>{

    keys[
      e.key.toLowerCase()
    ]=true;

    if(e.code==='Space'){
      keys.space=true;
    }

    if(
      e.key.toLowerCase()==='r'
    ){
      location.reload();
    }

  }
);


addEventListener(
  'keyup',
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

    if(e.code==='Space'){
      keys.space=false;
    }

  }
);


/* =========================================================

========================================================= */

const joystickInner =
  document.getElementById(
    'joystickInner'

function updateJoystick(e){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height/2;

  let x =
    e.clientX-centerX;

  let y =
    e.clientY-centerY;

  const max =
    rect.width/2-30;

  const distance =
    Math.sqrt(
      x*x+y*y
    );

  if(distance>max){

    x =
      x/distance*max;

    y =
      y/distance*max;

  }


  joystickX =
    x/max;

  joystickY =
    y/max;


  joystickInner.style.transform =
    `translate(${x}px,${y}px)`;

}


function resetJoystick(){

  joystickActive=false;

  joystickX=0;
  joystickY=0;

  joystickInner.style.transform =
    'translate(0,0)';

}


joystick.addEventListener(
  'pointerdown',
  e=>{

    e.preventDefault();

    joystickActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(e);

    startMusic();

  }
);


joystick.addEventListener(
  'pointermove',
  e=>{

    if(
      joystickActive
    ){
      updateJoystick(e);
    }

  }
);


joystick.addEventListener(
  'pointerup',
  resetJoystick
);

joystick.addEventListener(
  'pointercancel',
  resetJoystick
);

/* =========================================================
   ЖИЗНИ
========================================================= */

let lives=3;

let velocityY=0;

let onGround=false;

let invulnerable=false;

let finished=false;

let coinsCollected=0;

let startTime=
  performance.now();


/* =========================================================
   МУЗЫКА
========================================================= */

let audioContext=null;

let musicPlaying=false;

let musicTimer=null;

const musicButton =
  document.getElementById(
    'musicButton'
  );


function startMusic(){

  if(musicPlaying)
    return;


  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    audioContext.resume();


    const master =
      audioContext.createGain();

    master.gain.value=.12;

    master.connect(
      audioContext.destination
    );


    const notes=[
      261.63,
      329.63,
      392.00,
      329.63,
      293.66,
      349.23,
      440.00,
      349.23,
      261.63,
      329.63,
      392.00,
      523.25
    ];


    let noteIndex=0;


    function play(){

      if(!musicPlaying)
        return;


      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      oscillator.type=
        'triangle';


      oscillator.frequency.value=
        notes[noteIndex];


      gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
      );


      gain.gain.exponentialRampToValueAtTime(
        .16,
        audioContext.currentTime+.025
      );


      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+.32
      );


      oscillator.connect(gain);

      gain.connect(master);


      oscillator.start();

      oscillator.stop(
        audioContext.currentTime+.34
      );


      noteIndex=
        (noteIndex+1)%
        notes.length;


      musicTimer=
        setTimeout(
          play,
          340
        );

    }


    musicPlaying=true;

    musicButton.textContent=
      '🔊 Музыка';

    play();

  }catch(error){

    console.log(
      'Music error:',
      error
    );

  }

}


function stopMusic(){

  musicPlaying=false;

  clearTimeout(
    musicTimer
  );

  musicButton.textContent=
    '🔇 Музыка';

}


musicButton.addEventListener(
  'click',
  ()=>{

    if(musicPlaying){

      stopMusic();

    }else{

      startMusic();

    }

  }
);

/* =========================================================
   СОБЫТИЕ ПОЛУЧЕНИЯ УРОНА
========================================================= */

function damage(){

  if(invulnerable)
    return;


  lives--;

  document.getElementById(
    'lives'
  ).textContent=lives;


  if(lives<=0){

    gameOver();

    return;

  }


  invulnerable=true;

  player.position.set(
    respawn.x,
    respawn.y,
    respawn.z
  );


  player.visible=false;


  let flashes=0;


  const interval =
    setInterval(
      ()=>{

        player.visible=
          !player.visible;

        flashes++;


        if(flashes>8){

          clearInterval(
            interval
          );

          player.visible=true;

          invulnerable=false;

        }

      },
      120
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  finished=true;

  document.getElementById(
    'messageTitle'
  ).textContent=
    '💥 Игра окончена';


  document.getElementById(
    'messageText'
  ).textContent=
    'Монеты: '+
    coinsCollected;


  document.getElementById(
    'message'
  ).style.display=
    'block';

}


/* =========================================================
   ПОБЕДА
========================================================= */

function victory(){

  finished=true;

  document.getElementById(
    'messageTitle'
  ).textContent=
    '🏆 ПОБЕДА!';


  const elapsed =
    (
      performance.now()-
      startTime
    )/1000;


  document.getElementById(
    'messageText'
  ).innerHTML=
    'Ты прошёл зимний паркур!<br><br>'+
    '🪙 Монеты: '+
    coinsCollected+
    '<br>'+
    '⏱ Время: '+
    elapsed.toFixed(1)+
    ' сек.';


  document.getElementById(
    'message'
  ).style.display=
    'block';

}


/* =========================================================
   ПРОВЕРКА ЗЕМЛИ
========================================================= */

function checkPlatforms(){

  onGround=false;


  for(
    const p of platforms
  ){

    const halfW=
      p.width/2;

    const halfD=
      p.depth/2;


    const top=
      p.object.position.y+
      p.height/2;


    const insideX=
      player.position.x>
      p.object.position.x-
      halfW-.45 &&

      player.position.x<
      p.object.position.x+
      halfW+.45;


    const insideZ=
      player.position.z>
      p.object.position.z-
      halfD-.45 &&

      player.position.z<
      p.object.position.z+
      halfD+.45;


    if(
      insideX &&
      insideZ &&
      player.position.y<=
      top+1.0 &&
      player.position.y>=
      top-.8 &&
      velocityY<=0
    ){

      player.position.y=
        top;

      velocityY=0;

      onGround=true;

    }

  }

}


/* =========================================================
   ПРОВЕРКА ЧЕКПОИНТА
========================================================= */

function checkCheckpoint(){

  if(
    checkpointIndex<
    checkpoints.length
  ){

    const target=
      checkpoints[
        checkpointIndex
      ];


    if(
      player.position.z<
      target
    ){

      checkpointIndex++;


      respawn={
        x:player.position.x,
        y:player.position.y+1,
        z:player.position.z+2
      };


      showCheckpoint();

    }

  }

}


/* =========================================================
   ПРОВЕРКА МОНЕТ
========================================================= */

function checkCoins(){

  for(
    const coin of coins
  ){

    if(
      coin.userData.collected
    )
      continue;


    coin.rotation.y+=.08;

    coin.rotation.z+=.025;


    const distance=
      coin.position.distanceTo(
        player.position
      );


    if(distance<1.35){

      coin.userData.collected=
        true;

      coin.visible=false;

      coinsCollected++;


      document.getElementById(
        'coins'
      ).textContent=
        coinsCollected;

    }

  }

}


/* =========================================================
   ПРОВЕРКА ПРЕПЯТСТВИЙ
========================================================= */

const hazards =
  scene.children.filter(
    object=>
      object.userData &&
      object.userData.hazard
  );


function checkHazards(){

  for(
    const hazard of hazards
  ){

    const dx=
      Math.abs(
        player.position.x-
        hazard.position.x
      );

    const dz=
      Math.abs(
        player.position.z-
        hazard.position.z
      );

    const dy=
      Math.abs(
        player.position.y-
        hazard.position.y
      );


    if(
      dx<
      hazard.geometry.parameters.width/2+
      .5 &&

      dz<
      hazard.geometry.parameters.depth/2+
      .5 &&

      dy<
      hazard.geometry.parameters.height/2+
      1
    ){

      damage();

    }

  }

}


/* =========================================================
   ДВИЖЕНИЕ
========================================================= */

const clock =
  new THREE.Clock();


function update(){

  if(finished)
    return;


  const dt=
    Math.min(
      clock.getDelta(),
      .033
    );


  /* --------------------------------
     ПОВОРОТ
  -------------------------------- */


  let turn=
    joystickX;


  if(
    keys.arrowleft ||
    keys.a
  ){

    turn-=1;

  }


  if(
    keys.arrowright ||
    keys.d
  ){

    turn+=1;

  }


  const turnSpeed=
    2.7;


  player.rotation.y-=
    turn*
    turnSpeed*
    dt;


  /* --------------------------------
     СКОРОСТЬ
  -------------------------------- */


  let speed=
    6.2;


  if(
    joystickY<-.25
  ){

    speed=
      8+
      (-joystickY)*3;

  }


  if(
    joystickY>.4
  ){

    speed=2.7;

  }


  if(
    keys.w ||
    keys.arrowup
  ){

    speed=9;

  }


  if(
    keys.s ||
    keys.arrowdown
  ){

    speed=2.8;

  }


  /* --------------------------------
     АВТОБЕГ
  -------------------------------- */


  const direction=
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyQuaternion(
    player.quaternion
  );


  player.position.x+=
    direction.x*
    speed*
    dt;


  player.position.z+=
    direction.z*
    speed*
    dt;


  /* --------------------------------
     ПРЫЖОК
  -------------------------------- */


  if(
    keys.space &&
    onGround &&
    !jumping
  ){

    velocityY=
      9;

    onGround=false;

    jumping=true;

  }


  if(!keys.space){

    jumping=false;

  }


  /* --------------------------------
     ГРАВИТАЦИЯ
  -------------------------------- */


  velocityY-=
    23*
    dt;


  player.position.y+=
    velocityY*
    dt;


  checkPlatforms();


  /* --------------------------------
     ЧЕКПОИНТЫ
  -------------------------------- */

  checkCheckpoint();


  /* --------------------------------
     МОНЕТЫ
  -------------------------------- */

  checkCoins();


  /* --------------------------------
     ОПАСНОСТИ
  -------------------------------- */

  checkHazards();


  /* --------------------------------
     ПАДЕНИЕ
  -------------------------------- */

  if(
    player.position.y<
    -10
  ){

    damage();

  }


  /* --------------------------------
     ФИНИШ
  -------------------------------- */

  if(
    player.position.z<
    -113 &&
    player.position.y>
    8
  ){

    victory();

  }


  /* --------------------------------
     АНИМАЦИЯ ИГРОКА
  -------------------------------- */

  const running=
    Math.abs(speed)>.1;


  if(running){

    leg1.rotation.x=
      Math.sin(
        performance.now()*.012
      )*.35;

    leg2.rotation.x=
      -leg1.rotation.x;

  }


  /* --------------------------------
     АНИМАЦИЯ КРИСТАЛЛОВ
  -------------------------------- */

  scene.traverse(
    object=>{

      if(
        object.material===
        crystalMaterial
      ){

        object.rotation.y+=
          dt*.5;

      }

    }
  );


  /* --------------------------------
     СНЕГ
  -------------------------------- */

  updateSnow(
    dt
  );


  /* --------------------------------
     КАМЕРА
  -------------------------------- */

  const cameraDistance=
    9.5;


  const cameraHeight=
    5.3;


  const cameraOffset=
    new THREE.Vector3(
      0,
      cameraHeight,
      cameraDistance
    );


  cameraOffset.applyQuaternion(
    player.quaternion
  );


  const desiredCamera=
    new THREE.Vector3(
      player.position.x+
      cameraOffset.x,

      player.position.y+
      cameraOffset.y,

      player.position.z+
      cameraOffset.z
    );


  camera.position.lerp(
    desiredCamera,
    .075
  );


  const bob=
    running
    ?
    Math.sin(
      performance.now()*.014
    )*.07
    :
    0;


  camera.position.y+=
    bob;


  camera.lookAt(
    player.position.x,
    player.position.y+1.1,
    player.position.z-4
  );


  /* --------------------------------
     ВРЕМЯ
  -------------------------------- */

  const elapsed=
    (
      performance.now()-
      startTime
    )/1000;


  document.getElementById(
    'time'
  ).textContent=
    elapsed.toFixed(1);

}


/* =========================================================
   СНЕГ
========================================================= */

const snowCount=1200;

const snowPositions=[];


for(
  let i=0;
  i<snowCount;
  i++
){

  snowPositions.push(

    (Math.random()-.5)*
    100,

    Math.random()*
    40,

    Math.random()*
    150-
    120

  );

}


const snowGeometry=
  new THREE.BufferGeometry();


snowGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(
    snowPositions,
    3
  )
);


const snowMaterialPoints=
  new THREE.PointsMaterial({

    color:0xffffff,

    size:.16,

    transparent:true,

    opacity:.82

  });


const snowParticles=
  new THREE.Points(
    snowGeometry,
    snowMaterialPoints
  );


scene.add(
  snowParticles
);


function updateSnow(dt){

  const positions=
    snowGeometry.attributes
      .position.array;


  for(
    let i=0;
    i<positions.length;
    i+=3
  ){

    positions[i+1]-=
      dt*2.5;


    positions[i]+=
      Math.sin(
        performance.now()*.0005+
        i
      )*
      dt*
      .25;


    if(
      positions[i+1]<0
    ){

      positions[i+1]=40;

    }

  }


  snowGeometry.attributes
    .position.needsUpdate=true;

}


/* =========================================================
   resize
========================================================= */

addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   ЗАПУСК
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  update();


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>
